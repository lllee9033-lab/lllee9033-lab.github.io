navbar:
  auto_hide: false
  color:
    left: '#2f6f59'
    right: '#315979'
    transparency: 35
  width:
    home: 1200px
    pages: 1000px
  links:
    首页:
      path: /
      icon: fa-regular fa-house
    归档:
      path: /archives/
      icon: fa-regular fa-archive
    关于我:
      path: /about/
      icon: fa-regular fa-user
